name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check generated types are up to date
        run: |
          pnpm run generate:api
          npx prettier --write src/generated/api.d.ts
          git diff --exit-code src/generated/api.d.ts || {
            echo "::error::Generated API types are out of date. Run 'pnpm run sync:api' and commit the result."
            exit 1
          }

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:run

      - name: Build
        run: pnpm run build
